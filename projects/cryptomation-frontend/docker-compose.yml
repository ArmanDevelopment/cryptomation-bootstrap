name: cryptomation-bootstrap

# =============================================================================
# Frontend app. Safe to run from this directory or via bootstrap.
#
# Project name matches root docker-compose.yml so shared volumes/networks
# (e.g. cryptomation_frontend_node_modules) are not re-claimed by a different
# compose project when running from this directory.
#
# .env is always overwritten on start from .env.example.
# From this directory:
#   docker compose up -d
#
# From bootstrap (all projects):
#   ./scripts/start.sh
# =============================================================================

include:
  - path: compose.infra.yml

services:
  cryptomation-frontend:
    build:
      # Build context = actual Next.js source (sibling to cryptomation-bootstrap)
      context: ../../../cryptomation-frontend
      # Dockerfile lives in bootstrap; path is relative to build context
      dockerfile: ../cryptomation-bootstrap/projects/cryptomation-frontend/Dockerfile
      target: development
    container_name: cryptomation-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      # Bind to all interfaces so nginx can reach it inside Docker network
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      # Polling ensures reliable HMR inside bind-mounted directories
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Source code from sibling frontend repo — live edit, no rebuild needed
      - ../../../cryptomation-frontend:/app
      # Named volume over node_modules so host packages don't shadow container ones.
      # Populated from image layer (npm ci in deps stage) on first start.
      - frontend_node_modules:/app/node_modules
    networks:
      - cryptomation_shared
    # Port intentionally not exposed to host — access via nginx at cryptomation.local
    # Uncomment for direct access when debugging:
    # ports:
    #   - "3000:3000"

volumes:
  frontend_node_modules:
    name: cryptomation_frontend_node_modules
