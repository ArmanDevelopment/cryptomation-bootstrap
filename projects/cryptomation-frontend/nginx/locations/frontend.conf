# =============================================================================
# cryptomation-frontend — locations (included inside the shared gateway vhost)
# =============================================================================

# Next.js HMR WebSocket
location /_next/webpack-hmr {
    proxy_pass           http://cryptomation-frontend:3000;
    proxy_http_version   1.1;
    proxy_set_header     Upgrade     $http_upgrade;
    proxy_set_header     Connection  $connection_upgrade;
    proxy_set_header     Host        $host;
    proxy_cache_bypass   $http_upgrade;
    proxy_read_timeout   86400s;
}

# Next.js compiled static assets — long cache
location /_next/static/ {
    proxy_pass          http://cryptomation-frontend:3000;
    proxy_http_version  1.1;
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto  $scheme;
    expires             1y;
    add_header          Cache-Control "public, immutable";
}

# SSR pages, Next.js API routes, public assets
location / {
    proxy_pass          http://cryptomation-frontend:3000;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade            $http_upgrade;
    proxy_set_header    Connection         $connection_upgrade;
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto  $scheme;
    proxy_buffering     off;
    proxy_read_timeout  60s;
}
