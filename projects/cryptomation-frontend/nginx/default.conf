# =============================================================================
# cryptomation-frontend — Project Nginx Source Template
#
# Active copy (templated) lives at:
#   cryptomation-bootstrap/nginx/templates/cryptomation-frontend.conf.template
#
# server_name is substituted from bootstrap .env → NGINX_SERVER_NAME
# =============================================================================

upstream cryptomation_frontend {
    server  cryptomation-frontend:3000;
    keepalive  32;
}

server {
    listen  80;
    server_name  ${NGINX_SERVER_NAME};

    location /_next/webpack-hmr {
        proxy_pass           http://cryptomation_frontend;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade     $http_upgrade;
        proxy_set_header     Connection  $connection_upgrade;
        proxy_set_header     Host        $host;
        proxy_cache_bypass   $http_upgrade;
        proxy_read_timeout   86400s;
    }

    location /_next/static/ {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        expires             1y;
        add_header          Cache-Control "public, immutable";
    }

    location / {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         $connection_upgrade;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}
