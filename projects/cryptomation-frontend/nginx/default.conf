# =============================================================================
# cryptomation-frontend — Project Nginx Source Template
#
# This file documents the nginx virtual host for this project.
# The active copy that nginx uses lives at:
#   cryptomation-bootstrap/nginx/conf.d/cryptomation-frontend.conf
#
# To activate a fresh copy:
#   cp projects/cryptomation-frontend/nginx/default.conf \
#      nginx/conf.d/cryptomation-frontend.conf
#   docker exec cryptomation_nginx nginx -s reload
# =============================================================================

upstream cryptomation_frontend {
    server  cryptomation-frontend:3000;
    keepalive  32;
}

server {
    listen  80;
    server_name  cryptomation.local;

    location /_next/webpack-hmr {
        proxy_pass           http://cryptomation_frontend;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade     $http_upgrade;
        proxy_set_header     Connection  $connection_upgrade;
        proxy_set_header     Host        $host;
        proxy_cache_bypass   $http_upgrade;
        proxy_read_timeout   86400s;
    }

    location /_next/static/ {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        expires             1y;
        add_header          Cache-Control "public, immutable";
    }

    location / {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         $connection_upgrade;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}
