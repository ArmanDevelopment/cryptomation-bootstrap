name: cryptomation-bootstrap

# =============================================================================
# Entry point: includes shared infra + all projects.
#
# ADDING A NEW PROJECT:
#   1. Create projects/<name>/ with its own docker-compose.yml
#      (include ../../compose.infra.yml like cryptomation-frontend)
#   2. Add an include entry below for that file
#   3. Add nginx/conf.d/<name>.conf
#   4. ./scripts/start.sh
# =============================================================================

include:
  - path: compose.infra.yml
  - path: projects/cryptomation-frontend/docker-compose.yml
