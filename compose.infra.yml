# Shared infra — included by bootstrap and by project compose files.
# Do not run this file alone.

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: cryptomation_nginx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Used by /etc/nginx/templates/*.template → conf.d via envsubst
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-cryptomation.local}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Generated by scripts/_utils/sync.sh from nginx/gateway.conf.template
      # Official nginx image: *.template → envsubst → /etc/nginx/conf.d/
      - ./nginx/templates:/etc/nginx/templates:ro
      # Generated by scripts/_utils/sync.sh from projects/*/nginx/locations/
      - ./nginx/locations:/etc/nginx/locations:ro
    networks:
      - cryptomation_shared

  cryptomation_postgres:
    image: postgres:16-alpine
    container_name: cryptomation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptomation}
      POSTGRES_USER: ${POSTGRES_USER:-cryptomation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptomation}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cryptomation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptomation} -d ${POSTGRES_DB:-cryptomation}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cryptomation_shared

  cryptomation_mailpit:
    image: axllent/mailpit
    container_name: cryptomation_mailpit
    restart: unless-stopped
    ports:
      # SMTP stays internal (1025). UI host port is configurable.
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - cryptomation_shared

networks:
  # Created by scripts/_utils/sync.sh (cryptomation_ensure_network) before compose.
  # external avoids "exists but was not created for project …" warnings when the
  # network outlives compose projects or was created by an older project name.
  cryptomation_shared:
    name: cryptomation_shared
    external: true

volumes:
  cryptomation_postgres_data:
    name: cryptomation_postgres_data
