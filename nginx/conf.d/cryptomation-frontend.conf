# =============================================================================
# cryptomation-frontend — Nginx Virtual Host
#
# Routes: http://cryptomation.local → cryptomation-frontend:3000
#
# "cryptomation-frontend" resolves via Docker DNS because both nginx and the
# frontend container share the cryptomation_shared network.
#
# Add to host /etc/hosts:
#   127.0.0.1  cryptomation.local
# =============================================================================

upstream cryptomation_frontend {
    server  cryptomation-frontend:3000;
    keepalive  32;
}

server {
    listen  80;
    server_name  cryptomation.local;

    # Next.js HMR WebSocket — browser connects ws://cryptomation.local/_next/webpack-hmr
    location /_next/webpack-hmr {
        proxy_pass           http://cryptomation_frontend;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade     $http_upgrade;
        proxy_set_header     Connection  $connection_upgrade;
        proxy_set_header     Host        $host;
        proxy_cache_bypass   $http_upgrade;
        proxy_read_timeout   86400s;
    }

    # Next.js compiled static assets — long cache
    location /_next/static/ {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        expires             1y;
        add_header          Cache-Control "public, immutable";
    }

    # SSR pages, API routes, public assets
    location / {
        proxy_pass          http://cryptomation_frontend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade            $http_upgrade;
        proxy_set_header    Connection         $connection_upgrade;
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;
        proxy_buffering     off;
        proxy_read_timeout  60s;
    }
}
