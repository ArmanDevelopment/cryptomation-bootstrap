user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use  epoll;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;
    keepalive_timeout  65;
    client_max_body_size  50m;

    gzip  on;
    gzip_vary  on;
    gzip_proxied  any;
    gzip_comp_level  6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # WebSocket upgrade map — available to all project conf.d/*.conf files
    # via $http_upgrade / $connection_upgrade variables.
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # Shared gateway vhost (from nginx/templates via envsubst).
    # Per-project location snippets live in /etc/nginx/locations/*.conf
    # and are included from inside that server block.
    include /etc/nginx/conf.d/*.conf;
}
